<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 504" width="804" height="504" role="img" aria-labelledby="t2 d2">
<title id="t2">Ideas per category, split by tier</title>
<desc id="d2">Stacked horizontal bars. Each bar is a category; segments count ideas in each tier. Totals are printed at the bar end.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --t-building-now: #2a78d6;--t-whitespace: #eb6834;--t-moonshot: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --t-building-now: #3987e5;--t-whitespace: #d95926;--t-moonshot: #199e70; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font-size: 20px; font-weight: 650; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .axis-label { fill: var(--ink2); font-size: 13px; font-weight: 600; }
  .tick { fill: var(--muted); font-size: 12px; }
  .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .legend { fill: var(--ink2); font-size: 13px; }
  .val { fill: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip-text { font-size: 10.5px; font-weight: 650; fill: #0b0b0b; }
  .fill-building-now { fill: var(--t-building-now); }.fill-whitespace { fill: var(--t-whitespace); }.fill-moonshot { fill: var(--t-moonshot); }
</style>
<rect class="bg" x="0" y="0" width="804" height="504" rx="12"/>
